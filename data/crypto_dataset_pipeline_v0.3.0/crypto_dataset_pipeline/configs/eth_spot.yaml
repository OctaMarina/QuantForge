# Configurație ETH (Binance spot ETHUSDT) pentru build-uri lungi. Puncte de plecare, NU valori optimizate.
# IMPORTANT: activul se schimbă din instrument.base / instrument.quote (simbolul se derivă: ETHUSDT).
# Setarea doar a instrument.symbol=ETHUSDT cu base=BTC este refuzată de validare (unități, nume de coloane,
# perechea DVOL-RV și activele premium depind de base/quote).
#
#   python crypto_dataset.py download --config configs/eth_spot.yaml
#   python crypto_dataset.py build    --config configs/eth_spot.yaml
#   python crypto_dataset.py build    --config configs/eth_spot.yaml --set bars.volume.threshold=6000
#
# Codul de ieșire al build-ului este 3 dacă rezultatul e incomplet (o zi de tranzacții care nu a putut fi
# obținută, sau o serie de information bars oprită de garda de colaps): scripturile trebuie să-l verifice.
instrument:
  exchange: binance
  market_type: spot
  base: ETH
  quote: USDT                  # notionalul barelor este în USDT, nu în USD
period:
  start: "2021-09-01T00:00:00Z"
  end:   "2026-09-01T00:00:00Z"
  # o lună de încălzire înainte de start: ferestrele pe bare (structural W=200, rv_bars, lambda) sunt deja
  # pline la începutul exportului. Schimbarea originii schimbă granițele barelor (și series_id).
  bar_origin: "2021-08-01T00:00:00Z"
warmup:
  intraday_days: 31
  daily_days: 200
bars:
  types: [time, volume, notional]
  # information-driven bars: scripts/eth_datasets.sh calibrates them (scripts/calibrate_information_bars.py)
  # and passes the per-type parameters; see docs/INFORMATION_BARS.md and docs/RUN_ETH.md
  time: {interval: 5min}
  volume: {threshold: "3000"}                          # ETH / bară
  notional: {threshold: "7500000", currency: quote}    # USDT / bară
  information:
    sign: aggressor                      # agresorul observat (isBuyerMaker); tick_rule = aproximarea AFML
    ewma_span_bars: 20
    ewma_span_ticks: 10000
    warmup_ticks: 10000
    expected_ticks_bounds: null
    fixed_expected_ticks: null           # runs bars: E0[T] := H (recomandat; calibrat de script)
    min_expected_imbalance_ratio: null
    imbalance_threshold: rms             # rms (recomandat) | afml (literal, colapsează pe ETHUSDT)
    rms_horizon_ticks: null              # calibrat de script, per tip (bars.information.per_type)
    guard_max_bars_per_day: 5000
    guard_max_open_days: 2
    per_type: {}
  # o zi lipsă fără 404 confirmat (descărcare eșuată, cache incomplet) oprește build-ul înaintea ei
  on_unconfirmed_missing_day: stop
  archive_publication_lag_days: 2
features:
  # DVOL la 1 minut are o retenție istorică scurtă la Deribit; pe 5 ani folosiți rezoluția orară.
  # max_age trebuie să fie >= rezoluție (altfel orice lumânare ar fi „stale”; validarea refuză).
  dvol: {currencies: [BTC, ETH], resolution: "3600", max_age: 2h}
  skew: {currency: ETH}
  book:
    sizes_base: ["1", "10", "100"]                 # ETH
    sizes_quote: ["10000", "100000", "1000000"]    # USDT
storage:
  root: ./data
  max_download_gb: 200
