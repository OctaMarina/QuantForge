[project]
name = "cryptods"
version = "0.1.0"
description = "Reproducible, causal crypto datasets: time / volume / quote-notional bars with AFML-style features"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=15", "scipy>=1.11", "sortedcontainers>=2.4",
                "requests>=2.31", "websockets>=12", "PyYAML>=6", "lxml>=5"]

[project.optional-dependencies]
fast = ["numba>=0.60"]
dev = ["pytest>=8", "statsmodels>=0.14"]

[project.scripts]
crypto-dataset = "cryptods.cli:main"

[tool.setuptools.packages.find]
include = ["cryptods*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
