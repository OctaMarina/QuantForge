[project]
name = "quantforge"
version = "0.2.0"
description = "QuantForge: primary strategies, point-in-time features, purged validation, meta-labeling, bet sizing and evaluation for systematic crypto trading"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
# Machine-learning parts: feature_selection, models, sizing, metalabeling, ADF in features.fracdiff, parallel helpers.
ml = ["scikit-learn>=1.5", "scipy>=1.11", "statsmodels>=0.14", "joblib>=1.3"]
# Optional accelerator of the Wilder smoother in quant_forge.features (identical results without it).
fast = ["numba>=0.58"]
# Research notebooks: parquet caches (quant_forge.data), plots, notebook execution.
research = ["quantforge[ml,fast]", "pyarrow>=15", "matplotlib>=3.8", "catboost>=1.2", "ipykernel", "nbclient", "nbformat"]
dev = ["quantforge[ml]", "pytest>=8", "pyarrow>=15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
